<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbox Access | AppWall</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div style="margin-top: 15vh; text-align: center; background: rgba(0,0,0,0.85); padding: 50px; border-radius: 20px; display: inline-block; box-shadow: 0 15px 25px rgba(0,0,0,0.8);">
        
        <h2 style="color: #7FFF00; margin-top: 0;">Restricted Sandbox</h2>
        <p style="color: white; margin-bottom: 20px;">Developer testing area. Please enter your invite code.</p>
        
        <input type="password" id="inviteCode" placeholder="Enter Code" style="padding: 12px; font-size: 16px; border-radius: 8px; border: none; width: 80%; max-width: 250px; text-align: center; margin-bottom: 20px;">
        <br>
        
        <button onclick="verifyCode()" style="padding: 12px 30px; background: #7FFF00; color: black; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: transform 0.2s;">
            Enter Vault
        </button>
        
        <p id="errorMsg" style="color: #FF0055; display: none; margin-top: 20px; font-weight: bold;">Access Denied. Invalid Code.</p>
        
        <div style="margin-top: 30px;">
            <a href="index.html" style="color: #00FFFF; text-decoration: none; font-size: 14px;">&larr; Back to AppWall</a>
        </div>
    </div>

    <script>
        function verifyCode() {
            // Get the password the user typed
            const code = document.getElementById('inviteCode').value;
            const errorMessage = document.getElementById('errorMsg');

            // --- CHANGE YOUR PASSWORD HERE ---
            // Currently the password is: beta2026
            if (code === "beta2026") { 
                
                // If correct, hide error and show success
                errorMessage.style.display = "none";
                alert("Access Granted! Redirecting to test app...");
                
                // In the future, this is where we will link to your hidden app folder:
                // window.location.href = "apps/my-test-app/index.html";
                
            } else {
                // If wrong, show the error message
                errorMessage.style.display = "block";
            }
        }
    </script>

</body>
</html>
