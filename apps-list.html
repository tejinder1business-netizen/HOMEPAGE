<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Apps | AppWall.ca</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>AppWall.ca</h1>
    </header>

    <main style="max-width: 600px; margin: 30px auto; padding: 20px; background: rgba(0,0,0,0.85); border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.7);">
        <h2 style="color: #00FFFF; margin-top: 0; text-align: center;">Free Apps Directory</h2>
        
        <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; margin-bottom: 15px;">
            <div style="text-align: left;">
                <strong style="color: white; font-size: 1.1em; display: block;">🚖 Taxi Companion Pro</strong>
                <span style="color: #aaa; font-size: 0.85em;">Real-time driver coordination maps</span>
            </div>
            <button onclick="location.href='apps/taxi/index.html'" style="padding: 10px 20px; background: #ffd100; color: black; font-weight: bold; border: none; border-radius: 8px; cursor: pointer;">
                Download App
            </button>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <button onclick="window.close()" style="background: none; border: none; color: #ff3b30; font-weight: bold; cursor: pointer; font-size: 1.1em;">
                &larr; Close Menu
            </button>
        </div>
    </main>

</body>
</html>
