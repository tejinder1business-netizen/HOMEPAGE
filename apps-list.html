<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Apps | AppWall.ca</title>
    <!-- Links to your main styles so it keeps the brick background and 3D sign -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* This layout column keeps everything centered and leaves the wall visible */
        .page-container {
            display: flex;
            flex-direction: column;
            align-items: center; 
            margin-top: 20px;
            gap: 40px; /* Space between the app, description, and back button */
        }

        /* Title at the top */
        .page-title {
            color: #00FFFF;
            margin: 0;
            text-shadow: 0px 0px 10px rgba(0,255,255,0.8);
            font-size: 2.2em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Group to keep the button and its description neatly stacked together */
        .app-item-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; /* Space between round button and rectangular box */
        }

        /* 1. The Round Solid Neon Button */
        .app-round-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 140px; /* A bit larger than homepage buttons to fit the words */
            height: 140px;
            background-color: #00FFFF; /* Solid Cyan */
            color: #000000; /* Black text */
            border: 2px solid #00FFFF;
            border-radius: 50%; /* Makes it a perfect circle */
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            line-height: 1.3;
            padding: 10px;
            box-sizing: border-box;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.8); /* Strong neon glow */
            transition: transform 0.2s;
        }

        /* 2. The Rectangular Description Box */
        .app-desc-box {
            border: 2px solid #00FFFF; /* Neon cyan border */
            background-color: rgba(0, 0, 0, 0.7); /* Dark tinted glass background */
            color: #00FFFF; /* Neon cyan text */
            padding: 12px 20px;
            border-radius: 10px; /* Slightly rounded rectangle corners */
            font-weight: bold;
            font-size: 1.05em;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5); /* Outer glow */
            max-width: 250px;
        }

        /* Back Button at the bottom */
        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            color: #00FFFF;
            font-weight: bold;
            font-size: 1.1em;
            text-decoration: none;
            background: rgba(0, 0, 0, 0.6); /* Adds a small dark background so it's readable over the bricks */
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <h1>AppWall.ca</h1>
    </header>

    <main class="page-container">
        
        <h2 class="page-title">Free Apps</h2>
        
        <!-- ===================================================================== -->
        <!-- APP GROUP: Taxi Companion App -->
        <!-- ===================================================================== -->
        <div class="app-item-group">
            
            <!-- 1. The Round Neon Button (Links directly to the app) -->
            <a href="/apps/taxi/" class="app-round-btn">Taxi<br>Companion<br>App</a>
            
            <!-- 2. The Rectangular Neon Description Box -->
            <div class="app-desc-box">
                Real time flags and dispatch
            </div>

        </div>
        <!-- ===================================================================== -->

        <!-- In the future, you can copy and paste the APP GROUP block to add more apps underneath! -->

        <!-- The Separate Back Button -->
        <div style="margin-top: 20px;">
            <a href="index.html" class="back-btn">&larr; Back to App Wall</a>
        </div>

    </main>

</body>
</html>
