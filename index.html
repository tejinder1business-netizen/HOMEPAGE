<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppWall.ca | Welcome</title>
    <!-- Links to your updated style.css to show the wall -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* This invisible grid holds your buttons in the exact corners and sides you requested */
        .wall-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Two columns (left and right) */
            gap: 30px 20px; /* Tighter space to accommodate smaller buttons */
            width: 100%;
            max-width: 320px; /* Keeps the grid tight so it looks good on both phones and computers */
            margin: 40px auto;
            justify-items: center; 
        }

        /* This creates the perfect circle buttons */
        .circle-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 85px; /* Smaller button size */
            height: 85px; /* Smaller button size */
            border: 2px solid;
            border-radius: 50%; /* Makes it a circle */
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em; /* Scaled down text */
            line-height: 1.2;
            padding: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <header>
        <h1>AppWall.ca</h1>
    </header>

    <main class="wall-grid">
        
        <!-- ROW 1: TOP CORNERS -->
        <!-- Top Left: Free Apps (Cyan) -->
        <a href="apps-list.html" class="circle-btn" style="color: #000000; border-color: #00FFFF; box-shadow: 0 0 20px rgba(0, 255, 255, 0.8); background: #00FFFF;">Free<br>Apps</a>
        
        <!-- Top Right: Paid Apps (Magenta) -->
        <a href="#" class="circle-btn" style="color: #000000; border-color: #FF00FF; box-shadow: 0 0 20px rgba(255, 0, 255, 0.8); background: #FF00FF;">Paid<br>Apps</a>

        <!-- ROW 2: MIDDLE -->
        <!-- Middle Left: Sandbox (Lime Green) -->
        <a href="sandbox.html" class="circle-btn" style="color: #000000; border-color: #39FF14; box-shadow: 0 0 20px rgba(57, 255, 20, 0.8); background: #39FF14;">Sandbox</a>
        
        <!-- Middle Right: Empty Space (keeps Sandbox on the left side) -->
        <div style="visibility: hidden;"></div> 

        <!-- ROW 3: BOTTOM CORNERS -->
        <!-- Bottom Left: FAQ (Yellow) -->
        <a href="faq.html" class="circle-btn" style="color: #000000; border-color: #FFFF00; box-shadow: 0 0 20px rgba(255, 255, 0, 0.8); background: #FFFF00;">FAQ</a>
        
        <!-- Bottom Right: Mission (Neon Orange) -->
        <a href="mission.html" class="circle-btn" style="color: #000000; border-color: #FF5F1F; box-shadow: 0 0 20px rgba(255, 95, 31, 0.8); background: #FF5F1F;">Mission</a>

    </main>

</body>
</html>
