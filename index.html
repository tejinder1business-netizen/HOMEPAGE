<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppWall.ca | Welcome</title>
    <!-- Links to your updated style.css to show the wall and 3D sign -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* This creates a vertical column on the left side of the screen */
        .wall-nav {
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* Pins all the buttons to the left */
            gap: 25px; /* Adds perfect spacing between each button */
            margin: 40px 0 60px 10%; /* Leaves a 10% gap from the left edge so they don't touch the side of the phone/monitor */
        }

        /* This creates the perfect solid neon circle buttons */
        .circle-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 85px; 
            height: 85px; 
            border: 2px solid;
            border-radius: 50%; /* Makes it a circle */
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em; 
            line-height: 1.2;
            padding: 5px;
            box-sizing: border-box;
            transition: transform 0.2s; /* Adds a tiny bit of animation if someone hovers over them on a computer */
        }
    </style>
</head>
<body>

    <header>
        <h1>AppWall.ca</h1>
    </header>

    <!-- The new left-aligned vertical layout -->
    <main class="wall-nav">
        
        <!-- 1. Free Apps (Cyan) -->
        <a href="apps-list.html" class="circle-btn" style="color: #000000; border-color: #00FFFF; box-shadow: 0 0 20px rgba(0, 255, 255, 0.8); background: #00FFFF;">Free<br>Apps</a>
        
        <!-- 2. Paid Apps (Magenta) -->
        <a href="paid-apps.html" class="circle-btn" style="color: #000000; border-color: #FF00FF; box-shadow: 0 0 20px rgba(255, 0, 255, 0.8); background: #FF00FF;">Paid<br>Apps</a>

        <!-- 3. Mission (Neon Orange) -->
        <a href="mission.html" class="circle-btn" style="color: #000000; border-color: #FF5F1F; box-shadow: 0 0 20px rgba(255, 95, 31, 0.8); background: #FF5F1F;">Mission</a>

        <!-- 4. FAQ (Yellow) -->
        <a href="faq.html" class="circle-btn" style="color: #000000; border-color: #FFFF00; box-shadow: 0 0 20px rgba(255, 255, 0, 0.8); background: #FFFF00;">FAQ</a>
        
        <!-- 5. Suggestions (Lime Green) replacing Sandbox -->
        <a href="suggestion.html" class="circle-btn" style="color: #000000; border-color: #39FF14; box-shadow: 0 0 20px rgba(57, 255, 20, 0.8); background: #39FF14;">Suggest<br>Box</a>

    </main>

</body>
</html>
