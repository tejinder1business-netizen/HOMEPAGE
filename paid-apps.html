<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paid Apps | AppWall.ca</title>
    <!-- Links to your main styles so it keeps the brick background behind the box -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>AppWall.ca</h1>
    </header>

    <!-- Main box: Completely transparent background so the wall shows through perfectly -->
    <main style="max-width: 600px; margin: 50px auto; padding: 20px; background: transparent; text-align: center;">
        
        <!-- Title: Huge Fluorescent Magenta with heavy shadows to pop off the wall -->
        <h2 style="color: #FF00FF; margin-top: 0; text-shadow: 2px 2px 5px #000000, 0px 0px 20px rgba(255, 0, 255, 1); font-size: 3.5em; text-transform: uppercase; letter-spacing: 3px;">
            COMMING SOON
        </h2>
        
        <!-- Subtext -->
        <p style="color: #FFFFFF; font-size: 1.3em; line-height: 1.6; font-weight: bold; margin-bottom: 50px; text-shadow: 2px 2px 4px #000000, 0px 0px 10px #000000, 0px 0px 20px #000000;">
            We are working hard in the background on some powerful premium tools. Check back later!
        </p>

        <!-- The Close Button matching the Magenta theme -->
        <div>
            <a href="index.html" style="display: inline-block; padding: 10px 20px; background: rgba(0, 0, 0, 0.6); border: 1px solid #FF00FF; border-radius: 8px; color: #FF00FF; font-weight: bold; cursor: pointer; font-size: 1.1em; text-decoration: none; text-shadow: 0 0 5px rgba(255, 0, 255, 0.8);">
                &larr; Back to App Wall
            </a>
        </div>

    </main>

</body>
</html>
